<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSX Elite Scanner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #0a0a0a; color: #eee; margin: 0; padding: 12px; padding-bottom: 80px; }
  h1 { font-size: 18px; margin: 0 0 8px 0; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .status { font-size: 12px; color: #888; }
  .stats { display: flex; gap: 8px; margin-bottom: 16px; }
  .stat { flex: 1; background: #1a1a1a; padding: 10px; border-radius: 8px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: bold; }
  .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
  .green { color: #44cc44; }
  .red { color: #ff4444; }
  .yellow { color: #ffcc44; }
  .section { margin-bottom: 12px; }
  .section-title { font-size: 15px; font-weight: bold; padding: 12px 10px; background: #1a1a1a; border-radius: 8px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; }
  .section-title::after { content: "▾"; font-size: 12px; opacity: 0.6; transition: transform 0.15s; }
  .section.open .section-title::after { transform: rotate(180deg); }
  .section-body { display: none; padding-top: 8px; }
  .section.open .section-body { display: block; }
  .card { background: #1a1a1a; border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 4px solid #333; }
  .card.strong { border-left-color: #00cc00; background: #0d1a0d; }
  .card.buy { border-left-color: #44cc44; background: #0d170d; }
  .card.short { border-left-color: #3399ff; background: #0d1219; }
  .card.long { border-left-color: #9955cc; background: #130d19; }
  .card.wait { border-left-color: #ffcc44; background: #191610; }
  .card.exit { border-left-color: #ff2222; background: #1a0d0d; }
  .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .sym { font-size: 16px; font-weight: bold; }
  .badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; background: #333; font-weight: bold; }
  .badge.strong { background: #00aa00; }
  .badge.buy { background: #44aa44; color: #000; }
  .badge.short { background: #3399ff; }
  .badge.long { background: #9955cc; }
  .badge.wait { background: #ccaa00; color: #000; }
  .badge.exit { background: #cc2222; }
  .row2 { font-size: 13px; color: #ccc; margin-top: 6px; display: flex; justify-content: space-between; }
  .price { font-size: 14px; font-weight: bold; color: #fff; }
  .reason { font-size: 11px; color: #888; margin-top: 6px; font-style: italic; }
  button { background: #0066cc; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; display: flex; padding: 8px; border-top: 1px solid #333; }
  .bottom-nav button { flex: 1; background: transparent; color: #888; }
  .bottom-nav button.active { color: #fff; }
  .hidden { display: none; }
  .search-box { width: 100%; padding: 12px; font-size: 14px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="top">
  <h1>⚡ PSX Elite</h1>
  <button onclick="loadData()">🔄</button>
</div>
<div class="status" id="status">Loading...</div>
<div class="status" id="updated"></div>

<div class="stats" id="stats"></div>

<div id="view-home">
  <div class="section" id="sec_buy">
    <div class="section-title green" onclick="toggleSection('sec_buy')">🟢 BUY NOW</div>
    <div class="section-body"><div id="buy_now"></div></div>
  </div>
  <div class="section" id="sec_ready">
    <div class="section-title" style="color:#88dd44" onclick="toggleSection('sec_ready')">🟩 READY TO BUY</div>
    <div class="section-body"><div id="ready_list"></div></div>
  </div>
  <div class="section" id="sec_short">
    <div class="section-title" style="color:#3399ff" onclick="toggleSection('sec_short')">⚡ SHORT-TERM SWING</div>
    <div class="section-body"><div id="short_list"></div></div>
  </div>
  <div class="section" id="sec_long">
    <div class="section-title" style="color:#9955cc" onclick="toggleSection('sec_long')">📈 LONG-TERM</div>
    <div class="section-body"><div id="long_list"></div></div>
  </div>
  <div class="section" id="sec_trail">
    <div class="section-title" style="color:#ff9933" onclick="toggleSection('sec_trail')">📉 TRAIL STOPS</div>
    <div class="section-body"><div id="trail_list"></div></div>
  </div>
  <div class="section" id="sec_portfolio">
    <div class="section-title" style="color:#00cc99" onclick="toggleSection('sec_portfolio')">💼 PORTFOLIO</div>
    <div class="section-body"><div id="portfolio_summary"></div></div>
  </div>
  <div class="section" id="sec_trade">
    <div class="section-title" style="color:#ff9933" onclick="toggleSection('sec_trade')">⚙️ TRADE MANAGEMENT</div>
    <div class="section-body"><div id="trade_manage_list"></div></div>
  </div>
  <div class="section" id="sec_news">
    <div class="section-title" style="color:#66ccff" onclick="toggleSection('sec_news')">📰 NEWS IMPACT</div>
    <div class="section-body"><div id="news_list"></div></div>
  </div>
  <div class="section" id="sec_wait">
    <div class="section-title yellow" onclick="toggleSection('sec_wait')">🟡 WAIT FOR PULLBACK</div>
    <div class="section-body"><div id="wait_list"></div></div>
  </div>
  <div class="section" id="sec_exit">
    <div class="section-title red" onclick="toggleSection('sec_exit')">🔴 EXIT</div>
    <div class="section-body"><div id="exit_list"></div></div>
  </div>
</div>

<div id="view-search" class="hidden">
  <input type="text" class="search-box" id="search_input" placeholder="Search symbol (e.g. NETSOL)" oninput="searchStock()">
  <div id="search_results"></div>
</div>

<div class="bottom-nav">
  <button id="nav-home" class="active" onclick="showView('home')">🏠 Home</button>
  <button id="nav-search" onclick="showView('search')">🔍 Search</button>
  <button onclick="loadData()">🔄 Refresh</button>
</div>

<script>
const SUPABASE_URL = "https://lmuwpfejzzfsagkjddui.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtdXdwZmVqenpmc2Fna2pkZHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTU0MTQsImV4cCI6MjEwNTYzMTQxNH0.ENHKw9MgCVzZwK8nvVGLaNBILoKeZvGMvgOv5HUvODI";
const params = new URLSearchParams(window.location.search);
const USER_ID = params.get("user") || "TariqUsman";

let ALL_REPORT = [];
let ALL_ACTIONS = {};

function toggleSection(id) {
  document.getElementById(id).classList.toggle("open");
}

async function loadData() {
  document.getElementById("status").textContent = "Fetching...";
  try {
    const url = `${SUPABASE_URL}/rest/v1/signals?user_id=eq.${USER_ID}&select=data,updated_at`;
    const res = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (!rows.length) throw new Error("No data for user " + USER_ID);

    const data = rows[0].data;
    ALL_REPORT = data.report || [];
    ALL_ACTIONS = data.actions || {};

    document.getElementById("status").textContent = "✅ " + USER_ID;
    if (data && data.generated) {
        document.getElementById("updated").textContent =
            "Updated: " + new Date(data.generated).toLocaleString();
    } else {
        document.getElementById("updated").textContent =
            "Updated: " + new Date(rows[0].updated_at).toLocaleString();
    }
    renderStats();
    renderSections();
  } catch (e) {
    document.getElementById("status").textContent = "❌ " + e.message;
  }
}

function renderStats() {
  const buy = ALL_ACTIONS.buy_now || [];
  const wait = ALL_ACTIONS.wait || [];
  const exit = ALL_ACTIONS.exit || [];
  const watch = ALL_ACTIONS.watch || [];

  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="stat-num green">${buy.length}</div><div class="stat-label">Buy</div></div>
    <div class="stat"><div class="stat-num" style="color:#88dd44">${(ALL_ACTIONS.ready || []).length}</div><div class="stat-label">Ready</div></div>
    <div class="stat"><div class="stat-num yellow">${wait.length}</div><div class="stat-label">Wait</div></div>
    <div class="stat"><div class="stat-num red">${exit.length}</div><div class="stat-label">Exit</div></div>
    <div class="stat"><div class="stat-num">${watch.length}</div><div class="stat-label">Watch</div></div>
  `;
}

function renderSections() {
  const buy = ALL_ACTIONS.buy_now || [];
  document.getElementById("buy_now").innerHTML = buy.length
    ? buy.slice(0, 10).map(a => cardHTML(a.Symbol, a.Price, a.Shares, a.Target1, a.StopLoss, a.Confidence, a.Reasons, "strong")).join("")
    : "<div class='card'>No buy signals today</div>";

  const ready = ALL_ACTIONS.ready || [];
  document.getElementById("ready_list").innerHTML = ready.length
    ? ready.slice(0, 10).map(a => readyCard(a)).join("")
    : "<div class='card'>No ready-to-buy setups today</div>";

  const shortStocks = ALL_REPORT.filter(r => r.TradeStyle === "SHORT" && (r.Signal === "BUY" || r.Signal === "STRONG BUY"));
  const longStocks = ALL_REPORT.filter(r => r.TradeStyle === "LONG" && (r.Signal === "BUY" || r.Signal === "STRONG BUY"));

  document.getElementById("short_list").innerHTML = shortStocks.length
    ? shortStocks.slice(0, 6).map(r => styleCard(r, "short")).join("")
    : "<div class='card'>No short-term setups today</div>";

  document.getElementById("long_list").innerHTML = longStocks.length
    ? longStocks.slice(0, 6).map(r => styleCard(r, "long")).join("")
    : "<div class='card'>No long-term setups today</div>";

  const wait = ALL_ACTIONS.wait || [];
  document.getElementById("wait_list").innerHTML = wait.length
    ? wait.slice(0, 10).map(w => waitCard(w)).join("")
    : "<div class='card'>No waiting setups</div>";

  const exit = ALL_ACTIONS.exit || [];
  document.getElementById("exit_list").innerHTML = exit.length
    ? exit.map(e => exitCard(e)).join("")
    : "<div class='card'>No exits — portfolio healthy</div>";

  const trail = ALL_ACTIONS.trail || [];
  document.getElementById("trail_list").innerHTML = trail.length
    ? trail.map(t => trailCard(t)).join("")
    : "<div class='card'>No trailing stops yet — positions haven't moved up +3%</div>";

  const sum = ALL_ACTIONS.portfolio_summary || {};
  const pList = ALL_ACTIONS.portfolio || [];

  document.getElementById("portfolio_summary").innerHTML = pList.length
    ? `<div class="card" style="border-color:#00cc99">
         <div class="row1">
           <span class="sym">Portfolio</span>
           <span class="badge" style="background:${sum.ReturnPct >= 0 ? '#22aa22' : '#cc3333'}">${sum.ReturnPct >= 0 ? '+' : ''}${sum.ReturnPct}%</span>
         </div>
         <div class="row2">
           <span>Invested: PKR ${sum.TotalInvestment}</span>
           <span>Value: PKR ${sum.CurrentValue}</span>
         </div>
         <div class="row2">
           <span style="color:${(sum.CurrentValue - sum.TotalInvestment) >= 0 ? '#22aa22' : '#cc3333'}">P/L: PKR ${(sum.CurrentValue - sum.TotalInvestment).toFixed(2)}</span>
         </div>
         <div class="row2">
           <span>🟢 ${sum.Winners}</span>
           <span>🔴 ${sum.Losers}</span>
         </div>
       </div>`
    : "<div class='card'>No holdings in portfolio</div>";

  document.getElementById("trade_manage_list").innerHTML = pList.length
    ? pList.map(p => tradeManageCard(p)).join("")
    : "<div class='card'>No holdings to manage</div>";

  const news = ALL_ACTIONS.news || [];
  document.getElementById("news_list").innerHTML = news.length
    ? news.map(n => newsCard(n)).join("")
    : "<div class='card'>No news today</div>";
}

function newsCard(n) {
  const dir = n.Direction || "UNKNOWN";
  const color = dir === "POSITIVE" ? "#22aa22" : dir === "NEGATIVE" ? "#cc3333" : "#999999";
  const impact = n.Impact || "LOW";
  const impColor = impact === "HIGH" ? "#cc3333" : impact === "MEDIUM" ? "#ff9933" : "#666666";
  const stocks = (n.AffectedStocks || []).join(", ");
  return `
    <div class="card" style="border-color:${color}">
      <div class="row1">
        <span class="sym" style="font-size:13px">${n.Headline}</span>
      </div>
      <div class="row2">
        <span>${n.Category}</span>
        <span class="badge" style="background:${impColor}">${impact}</span>
      </div>
      <div class="row2">
        <span style="color:${color}">${dir}</span>
      </div>
      ${stocks ? `<div class="reason">Affects: ${stocks}</div>` : ""}
    </div>
  `;
}

function tradeManageCard(p) {
  const color = p.PLPercent >= 0 ? "#22aa22" : "#cc3333";
  const stop = p.StopLossAlert && p.StopLossAlert !== "NO STOP LOSS ALERT" ? p.StopLossAlert : "—";
  const exit = p.ExitAlert && p.ExitAlert !== "NO EXIT ALERT" ? p.ExitAlert : "—";
  const sell = p.SellAlert && p.SellAlert !== "NO SELL ALERT" ? p.SellAlert : "—";
  return `
    <div class="card" style="border-color:${color}">
      <div class="row1">
        <span class="sym">${p.Symbol}</span>
        <span class="badge" style="background:${color}">${p.PLPercent >= 0 ? '+' : ''}${p.PLPercent}%</span>
      </div>
      <div class="row2">
        <span>Buy: ${p.BuyPrice}</span>
        <span>Now: ${p.CurrentPrice}</span>
      </div>
      <div class="row2">
        <span>${p.Shares} shares</span>
        <span>${p.Action}</span>
      </div>
      <div class="reason">Stop: ${stop}</div>
      <div class="reason">Exit: ${exit}</div>
      <div class="reason">Sell: ${sell}</div>
    </div>
  `;
}

function trailCard(t) {
  return `
    <div class="card" style="border-color:#ff9933">
      <div class="row1">
        <span class="sym">${t.Symbol}</span>
        <span class="badge" style="background:#ff9933">+${t.PLPercent}%</span>
      </div>
      <div class="row2">
        <span>Buy: PKR ${t.BuyPrice}</span>
        <span>Now: PKR ${t.CurrentPrice}</span>
      </div>
      <div class="row2">
        <span style="color:#ff9933">📍 Trail Stop: PKR ${t.TrailingStop}</span>
      </div>
    </div>
  `;
}

function cardHTML(sym, price, shares, target, stop, conf, reasons, cls) {
  const full = ALL_REPORT.find(x => x.Symbol === sym);
  const zone = full && full.BuyZoneNote ? full.BuyZoneNote : "";
  const tier = full && full.EntryTier ? full.EntryTier : "";
  const rr   = full && full.RR ? full.RR : "";

  return `
    <div class="card ${cls}">
      <div class="row1">
        <span class="sym">${sym}</span>
        <span class="badge ${cls}">${conf}%</span>
      </div>
      ${(tier || rr) ? `<div class="row2"><span>Tier: ${tier}</span><span>R:R ${rr}</span></div>` : ""}
      <div class="row2">
        <span class="price">PKR ${price}</span>
        <span>${shares} shares</span>
      </div>
      ${zone ? `<div class="row2"><span>📍 ${zone}</span></div>` : ""}
      <div class="row2">
        <span>🎯 T1: ${target}</span>
        <span>🛑 Stop: ${stop}</span>
      </div>
      <div class="reason">↳ ${reasons.join(", ")}</div>
    </div>
  `;
}

function styleCard(r, cls) {
  return `
    <div class="card ${cls}">
      <div class="row1">
        <span class="sym">${r.Symbol}</span>
        <span class="badge ${cls}">${r.TradeStyle}</span>
      </div>
      <div class="row2">
        <span class="price">PKR ${r.Close}</span>
        <span>Score: ${Math.round(r.MasterScore)}</span>
      </div>
      <div class="row2">
        <span>🎯 T1: ${r.Target1}</span>
        <span>🛑 ${r.StopLoss}</span>
      </div>
      <div class="reason">↳ ${r.StyleReason} | RSI ${r.RSI}</div>
    </div>
  `;
}

function readyCard(a) {
  const tier = a.EntryTier || "";
  const rr   = a.RR || "";
  return `
    <div class="card buy">
      <div class="row1">
        <span class="sym">${a.Symbol}</span>
        <span class="badge buy">${a.Confidence}%</span>
      </div>
      ${(tier || rr) ? `<div class="row2"><span>Tier: ${tier}</span><span>R:R ${rr}</span></div>` : ""}
      <div class="row2">
        <span class="price">PKR ${a.Price}</span>
        <span>${a.Shares} shares</span>
      </div>
      <div class="row2">
        <span>📍 ${a.Zone}</span>
      </div>
      <div class="row2">
        <span>🎯 T1: ${a.Target1}</span>
        <span>🛑 Stop: ${a.StopLoss}</span>
      </div>
      <div class="reason">↳ ${a.Reasons.join(", ")}</div>
    </div>
  `;
}

function waitCard(w) {
  return `
    <div class="card wait">
      <div class="row1">
        <span class="sym">${w.Symbol}</span>
        <span class="badge wait">WAIT</span>
      </div>
      <div class="row2">
        <span class="price">${w.BuyZone}</span>
      </div>
      <div class="reason">Confidence: ${w.Confidence}%</div>
    </div>
  `;
}

function exitCard(e) {
  return `
    <div class="card exit">
      <div class="row1">
        <span class="sym">${e.Symbol}</span>
        <span class="badge exit">EXIT</span>
      </div>
      <div class="row2">
        <span class="price">PKR ${e.Price}</span>
        <span class="red">${e.LossPct}%</span>
      </div>
      <div class="reason">↳ ${e.Reason}</div>
    </div>
  `;
}

function showView(name) {
  document.getElementById("view-home").classList.toggle("hidden", name !== "home");
  document.getElementById("view-search").classList.toggle("hidden", name !== "search");
  document.getElementById("nav-home").classList.toggle("active", name === "home");
  document.getElementById("nav-search").classList.toggle("active", name === "search");
}

function searchStock() {
  const q = document.getElementById("search_input").value.toUpperCase().trim();
  const box = document.getElementById("search_results");

  if (q.length < 2) { box.innerHTML = ""; return; }

  const matches = ALL_REPORT.filter(r => r.Symbol.toUpperCase().includes(q));

  if (!matches.length) {
    box.innerHTML = "<div class='card'>No match found</div>";
    return;
  }

  box.innerHTML = matches.slice(0, 5).map(r => searchResultCard(r)).join("");
}

function searchResultCard(r) {
  const cls = r.Signal === "STRONG BUY" ? "strong" : r.Signal === "BUY" ? "buy" : "wait";
  return `
    <div class="card ${cls}">
      <div class="row1">
        <span class="sym">${r.Symbol}</span>
        <span class="badge ${cls}">${r.Signal}</span>
      </div>
      <div class="row2">
        <span>Live: PKR ${r.LivePrice || r.Close}</span>
        <span>RSI: ${r.RSI}</span>
      </div>
      <div class="row2">
        <span>Buy Zone: ${r.BuyZoneNote || "N/A"}</span>
      </div>
      <div class="row2">
        <span>🎯 T1: ${r.Target1}</span>
        <span>🛑 ${r.StopLoss}</span>
      </div>
      <div class="row2">
        <span>Phase: ${r.Pattern || "—"}</span>
        <span>Style: ${r.TradeStyle}</span>
      </div>
      <div class="row2">
        <span>Smart Money: ${r.SmartMoneyConfidence}</span>
        <span>Trend: ${r.TrendStatus}</span>
      </div>
      <div class="reason">↳ ${r.StyleReason}</div>
    </div>
  `;
}

setInterval(loadData, 15 * 60 * 1000);

loadData();
</script>

</body>
</html>
