name: PSX Agent Auto Run

on:
  schedule:
    # Runs every 30 minutes between 9:00 AM and 4:00 PM PKT (04:00 to 11:00 UTC), Mon-Fri
    - cron: '*/30 4-11 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pypsx-toolkit

      - name: Run Stock Agent
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          PSX_USER_ID: ${{ secrets.PSX_USER_ID }}
        run: python stock_agent.py

      - name: Commit and Push updated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f portfolio_history.csv portfolio_value_history.csv signal_history.csv psx_actions.json psx_report.json last_run_status.json
          git commit -m "Automated update: Signals and Portfolio" || echo "No changes to commit"
          git push
