name: PSX Agent

on:
  schedule:
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PSX Agent
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          PSX_USER_ID: ${{ secrets.PSX_USER_ID }}
        run: |
          python stock_agent.py || (echo '{"status":"fail","reason":"script crashed"}' > last_run_status.json && exit 1)


      - name: Commit history CSVs back
        if: always()
        run: |
          git config user.name "psx-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signal_history.csv portfolio_value_history.csv portfolio_history.csv portfolio_snapshot.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Auto: history update $(date -u +'%Y-%m-%d %H:%M')"
          git push || true